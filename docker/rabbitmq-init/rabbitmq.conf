# RabbitMQ fixture wiring (workstream B). `load_definitions` imports
# definitions.json at boot; nothing else here diverges from stock.
#
# What the definitions create, and why:
# - `fixture.events` (topic exchange) + `fixture.orders` (queue) + their
#   binding — the browse/publish surface. A topic exchange rather than the
#   default direct one, so routing-key reads have something to prove.
# - `probe` user (password `probe`) — the credential the provider fixture
#   connects with. `guest` is localhost-only by policy and the provider under
#   test may run in another container, so a dedicated user is the honest
#   fixture rather than a loopback exception.
load_definitions = /etc/rabbitmq/definitions.json
