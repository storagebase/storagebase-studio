# This rule is not used by the project storagebase-studio-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over studio.storagebase.org.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: storagebase-studio-operator
    app.kubernetes.io/managed-by: kustomize
  name: storagebasestudio-admin-role
rules:
- apiGroups:
  - studio.storagebase.org
  resources:
  - storagebasestudios
  verbs:
  - '*'
- apiGroups:
  - studio.storagebase.org
  resources:
  - storagebasestudios/status
  verbs:
  - get
