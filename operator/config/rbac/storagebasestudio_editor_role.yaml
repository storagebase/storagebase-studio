# This rule is not used by the project storagebase-studio-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the studio.storagebase.org.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: storagebase-studio-operator
    app.kubernetes.io/managed-by: kustomize
  name: storagebasestudio-editor-role
rules:
- apiGroups:
  - studio.storagebase.org
  resources:
  - storagebasestudios
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - studio.storagebase.org
  resources:
  - storagebasestudios/status
  verbs:
  - get
