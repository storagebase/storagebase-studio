name: StorageBase image

# The fork's image build (P6: StorageBase ships through fork-owned build files; upstream's own image
# workflows are left untouched and disabled per-repo if they misbehave).
#
# Builds deploy/storagebase/Dockerfile.storagebase and publishes it as
# ghcr.io/storagebase/storagebase-studio. The tag policy is deliberately simple: `latest` on main, plus
# `storagebase-<version>` on demand through workflow_dispatch, so fork releases never collide with
# upstream's bare-semver tag namespace.

on:
  push:
    branches:
      - main
    paths:
      - "deploy/storagebase/**"
      - "src/storagebase/**"
      - "src/components/storagebase/**"
      - "src/app/(storagebase)/**"
      - "src/app/api/sb/**"
      - "packages/storagebase-deps/**"
      - ".github/workflows/storagebase-image.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Fork release tag (published as storagebase-<version>)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push ghcr.io/storagebase/storagebase-studio
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118724b74785426e37555edc12f030a130 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@1a5ba38f0a2325bc7d21b7932ed8f5ebba8e72cb # v5.8.0
        with:
          images: ghcr.io/storagebase/storagebase-studio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=storagebase-${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492f198ff370ef09d1 # v6.18.0
        with:
          context: .
          file: deploy/storagebase/Dockerfile.storagebase
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JWT_SECRET_BUILD=build-time-placeholder-secret-32ch
            ADMIN_PASSWORD_BUILD=build
            USER_PASSWORD_BUILD=build
