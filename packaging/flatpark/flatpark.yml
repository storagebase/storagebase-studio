# FlatPark catalog descriptor for StorageBase Studio (issue #241).
#
# FlatPark (https://flatpark.org/) is a signed Flatpak remote that repackages
# official vendor downloads as extra-data - it does not build from source. This
# file is the catalog entry; org.storagebase.Studio.yml is the Flatpak manifest it
# points at.
#
# read-descriptor.mjs in flatpark/flatpark is a line scanner, not a YAML parser,
# so keep the plain two-space block style below exactly as it is.
id: org.storagebase.Studio
name: StorageBase Studio
summary: AI-powered SQL IDE for PostgreSQL, MySQL, MongoDB and more
website: https://storagebase.org
source_url: https://github.com/storagebase/storagebase-studio
build:
  manifest: org.storagebase.Studio.yml
  branch: stable
  mode: extra-data
catalog:
  category: Development
  # StorageBase packages its own application - FlatPark's "approved by construction"
  # case, which earns the developer-approved badge. The flag is only valid
  # alongside a row in their docs/upstream-approvals.md citing the submission PR
  # (flatpark/flatpark#158); their check-approvals.sh fails a true flag without
  # one, so the two must always move together.
  upstream_approved: true
  tags:
    - Database
    - SQL
    - PostgreSQL
    - MySQL
    - MongoDB
    - Redis
    - SQLite
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions: []
