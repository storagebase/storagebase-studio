id: org.storagebase.Studio
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: storagebase-studio
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Tauri/WebKitGTK SQL IDE. The window is a WebKitGTK view onto a server the
  # app starts itself on 127.0.0.1, so ipc and the loopback interface are both
  # in play; dri gives WebKit hardware-accelerated rendering.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # network is the core function: StorageBase Studio connects to PostgreSQL, MySQL,
  # SQL Server, Oracle, MongoDB and Redis over their own TCP protocols, to
  # Couchbase, ClickHouse, Apache Druid, Elasticsearch, OpenSearch and Apache
  # Trino over HTTP, and to an AI provider when
  # the user configures one with their own API key. It also covers 127.0.0.1,
  # so a database running on the host is reachable without any filesystem
  # permission.
  - --share=network
  # No --filesystem=home. Connections, query history and the generated
  # credentials live in the app's own per-app data directory, and every network
  # database is reached over TCP - including one on the host at 127.0.0.1.
  #
  # The two things that DO need a grant, because a SQLite path and a Unix socket
  # path are typed into the connection form rather than chosen through the
  # file-chooser portal:
  #   flatpak override --user --filesystem=/path/to/db.sqlite org.storagebase.Studio
  #   flatpak override --user --filesystem=/run/postgresql:ro org.storagebase.Studio
  # No ~/.ssh either: the SSH-tunnel feature reads private keys, which are too
  # sensitive to expose unasked. Users who need tunnels can opt in with
  #   flatpak override --user --filesystem=~/.ssh:ro org.storagebase.Studio
modules:
  - name: storagebase-studio
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 storagebase-studio-wrapper /app/bin/storagebase-studio
      - install -Dm644 org.storagebase.Studio.desktop /app/share/applications/org.storagebase.Studio.desktop
      - install -Dm644 org.storagebase.Studio.metainfo.xml /app/share/metainfo/org.storagebase.Studio.metainfo.xml
      - install -Dm644 org.storagebase.Studio.png /app/share/icons/hicolor/256x256/apps/org.storagebase.Studio.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: storagebase-studio-desktop.deb
        only-arches:
          - x86_64
        url: https://github.com/storagebase/storagebase-studio/releases/download/0.9.62/storagebase-studio-desktop_0.9.62_amd64.deb
        # Quoted because an all-digit digest would otherwise parse as a number
        # rather than a string. FlatPark's bot rewrites this whole block from
        # resolve-update.sh once the listing is merged.
        sha256: "dc9ff0af242dd00afbda720291b7bd655886972056a9545fe90c144fbdfb3382"
        size: 77678262
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: storagebase-studio-wrapper
      - type: file
        path: org.storagebase.Studio.desktop
      - type: file
        path: org.storagebase.Studio.metainfo.xml
      - type: file
        path: org.storagebase.Studio.png
