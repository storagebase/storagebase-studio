# StorageBase Studio — Helm values overlay (fork-owned, P6)
#
# StorageBase never edits the upstream chart (charts/libredb-studio). It deploys on TOP of it with
# this overlay, which only redirects the image at the fork build and documents the fork's extra env:
#
#   helm repo add libredb-studio https://libredb.org/libredb-studio/
#   helm upgrade --install storagebase-studio libredb-studio/libredb-studio \
#     --values deploy/storagebase/helm-values.yaml
#
# or from OCI:
#   helm upgrade --install storagebase-studio oci://ghcr.io/libredb/charts/libredb-studio \
#     --values deploy/storagebase/helm-values.yaml
#
# The fork's STORAGEBASE_* env vars (audit store, resource seed path, retention) are plain extraEnv
# rows here; everything else is upstream's values surface (see charts/libredb-studio/README.md).

image:
  # The fork image, built by .github/workflows/storagebase-image.yml from
  # deploy/storagebase/Dockerfile.storagebase.
  repository: ghcr.io/storagebase/storagebase-studio
  # Empty keeps the chart's default (appVersion). Pin a storagebase-<version> tag for a release.
  tag: ""

extraEnv:
  # Fork store driver: sqlite (default) or postgres. Server-side only.
  - name: STORAGEBASE_STORE_PROVIDER
    value: "sqlite"
  # Fork store location in the sqlite mode. Mount it on a volume.
  - name: STORAGEBASE_STORE_SQLITE_PATH
    value: "/app/data/storagebase.sqlite"
  # DSN for the postgres mode, when STORAGEBASE_STORE_PROVIDER=postgres.
  - name: STORAGEBASE_STORE_POSTGRES_URL
    value: ""
  # Audit retention, in days. 0 keeps everything.
  - name: STORAGEBASE_AUDIT_RETENTION_DAYS
    value: "90"
  # YAML file of preconfigured resource connections (same shape as upstream seeds, with roles:).
  - name: STORAGEBASE_RESOURCE_SEED_PATH
    value: ""
